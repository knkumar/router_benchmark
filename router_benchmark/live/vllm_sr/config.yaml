version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 300s

providers:
  defaults:
    default_model: cheap-small
  models:
    - name: cheap-small
      provider_model_id: gpt-5.4-nano
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0.20
        completion_per_1m: 1.25
      backend_refs:
        - name: openai-primary
          base_url: https://api.openai.com/v1
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: OPENAI_API_KEY
          weight: 100
    - name: mid-general
      provider_model_id: claude-sonnet-4-6
      external_model_ids:
        anthropic: claude-sonnet-4-6
      api_format: anthropic
      pricing:
        currency: USD
        prompt_per_1m: 3.00
        completion_per_1m: 15.00
      backend_refs:
        - name: anthropic-primary
          base_url: https://api.anthropic.com
          provider: anthropic
          auth_header: x-api-key
          api_key_env: ANTHROPIC_API_KEY
          weight: 100
    - name: strong-frontier
      provider_model_id: claude-opus-4-8
      external_model_ids:
        anthropic: claude-opus-4-8
      api_format: anthropic
      pricing:
        currency: USD
        prompt_per_1m: 5.00
        completion_per_1m: 25.00
      backend_refs:
        - name: anthropic-primary-strong
          base_url: https://api.anthropic.com
          provider: anthropic
          auth_header: x-api-key
          api_key_env: ANTHROPIC_API_KEY
          weight: 100

routing:
  modelCards:
    - name: cheap-small
      param_size: unknown
      context_window_size: 128000
      description: Cheap, fast tier for simple factual/short queries.
      capabilities: [chat]
      quality_score: 0.55
      modality: ar
      tags: [cheap, fast]
    - name: mid-general
      param_size: unknown
      context_window_size: 200000
      description: General-purpose mid tier for moderately complex reasoning and coding.
      capabilities: [chat, reasoning, tools]
      quality_score: 0.78
      modality: ar
      tags: [general]
    - name: strong-frontier
      param_size: unknown
      context_window_size: 200000
      description: Strong frontier tier for hard multi-step reasoning, debugging, and complex tasks.
      capabilities: [chat, reasoning, tools, long-context]
      quality_score: 0.95
      modality: ar
      tags: [premium]

  decisions:
    - name: route-business
      description: Business and management related queries.
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: domain
            name: business
      modelRefs:
        - model: mid-general
    - name: route-law
      description: Legal questions and policy topics.
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: domain
            name: law
      modelRefs:
        - model: strong-frontier
          use_reasoning: true
    - name: route-psychology
      description: Psychology and mental-health oriented prompts.
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: domain
            name: psychology
      modelRefs:
        - model: mid-general
    - name: route-health
      description: Health and medical information requests.
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: domain
            name: health
      modelRefs:
        - model: strong-frontier
    - name: route-computer-science
      description: Computer science and engineering prompts.
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: domain
            name: computer science
      modelRefs:
        - model: strong-frontier
          use_reasoning: true
    - name: default-route
      description: Catch-all route for domains outside the five named categories above.
      priority: 10
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: cheap-small

  signals:
    domains:
      - name: business
        description: Business and management related queries.
        mmlu_categories: [business]
      - name: law
        description: Legal questions and policy topics.
        mmlu_categories: [law]
      - name: psychology
        description: Psychology and mental-health oriented prompts.
        mmlu_categories: [psychology]
      - name: health
        description: Health and medical information requests.
        mmlu_categories: [health]
      - name: "computer science"
        description: Computer science and engineering prompts.
        mmlu_categories: ["computer science"]

global:
  stores:
    semantic_cache:
      enabled: false
  router:
    config_source: file
    strategy: priority
    model_selection:
      method: automix
      enabled: true
      automix:
        verification_threshold: 0.8
        max_escalations: 2
        cost_aware_routing: true
        cost_quality_tradeoff: 0.4
        discount_factor: 0.9
        use_logprob_verification: false
