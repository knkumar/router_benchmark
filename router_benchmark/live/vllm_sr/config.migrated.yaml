version: v0.3
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 300s
providers:
  defaults:
    default_model: cheap-small
  models:
  - name: cheap-small
    provider_model_id: gpt-5.4-nano
    pricing:
      currency: USD
      prompt_per_1m: 0.2
      completion_per_1m: 1.25
    api_format: openai
    backend_refs:
    - name: openai-primary
      base_url: https://api.openai.com/v1
      provider: openai
      auth_header: Authorization
      auth_prefix: Bearer
      api_key_env: OPENAI_API_KEY
      weight: 100
  - name: mid-general
    provider_model_id: claude-sonnet-4-6
    pricing:
      currency: USD
      prompt_per_1m: 3.0
      completion_per_1m: 15.0
    api_format: anthropic
    backend_refs:
    - name: anthropic-primary
      base_url: https://api.anthropic.com/v1
      provider: anthropic
      auth_header: x-api-key
      api_key_env: ANTHROPIC_API_KEY
      weight: 100
  - name: strong-frontier
    provider_model_id: claude-opus-4-8
    pricing:
      currency: USD
      prompt_per_1m: 5.0
      completion_per_1m: 25.0
    api_format: anthropic
    backend_refs:
    - name: anthropic-primary-strong
      base_url: https://api.anthropic.com/v1
      provider: anthropic
      auth_header: x-api-key
      api_key_env: ANTHROPIC_API_KEY
      weight: 100
routing:
  modelCards:
  - name: cheap-small
    param_size: unknown
    context_window_size: 128000
    description: Cheap, fast tier for simple factual/short queries.
    capabilities:
    - chat
    quality_score: 0.55
    modality: ar
    tags:
    - cheap
    - fast
  - name: mid-general
    param_size: unknown
    context_window_size: 200000
    description: General-purpose mid tier for moderately complex reasoning and coding.
    capabilities:
    - chat
    - reasoning
    - tools
    quality_score: 0.78
    modality: ar
    tags:
    - general
  - name: strong-frontier
    param_size: unknown
    context_window_size: 200000
    description: Strong frontier tier for hard multi-step reasoning, debugging, and
      complex tasks.
    capabilities:
    - chat
    - reasoning
    - tools
    - long-context
    quality_score: 0.95
    modality: ar
    tags:
    - premium
  domains:
  - name: business
    description: Business and management related queries.
    mmlu_categories:
    - business
    model_scores:
    - model: mid-general
      score: 0.85
  - name: law
    description: Legal questions and policy topics.
    mmlu_categories:
    - law
    model_scores:
    - model: strong-frontier
      score: 0.9
      use_reasoning: true
  - name: psychology
    description: Psychology and mental-health oriented prompts.
    mmlu_categories:
    - psychology
    model_scores:
    - model: mid-general
      score: 0.8
  - name: health
    description: Health and medical information requests.
    mmlu_categories:
    - health
    model_scores:
    - model: strong-frontier
      score: 0.88
  - name: computer science
    description: Computer science and engineering prompts.
    mmlu_categories:
    - computer science
    model_scores:
    - model: strong-frontier
      score: 0.92
      use_reasoning: true
  - name: other
    description: General fallback traffic.
    mmlu_categories:
    - other
    model_scores:
    - model: cheap-small
      score: 0.7
  signals: {}
global:
  stores:
    semantic_cache:
      enabled: false
  router:
    config_source: file
    strategy: priority
    model_selection:
      method: automix
      enabled: true
      automix:
        verification_threshold: 0.8
        max_escalations: 2
        cost_aware_routing: true
        cost_quality_tradeoff: 0.4
        discount_factor: 0.9
        use_logprob_verification: false
  services: {}
  integrations: {}
  model_catalog:
    embeddings: {}
    modules:
      classifier: {}
      hallucination_mitigation: {}
